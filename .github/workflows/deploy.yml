name: Cloud Resume CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/visitor-counter/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/visitor-counter/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Lambda Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  deploy:
    name: Deploy Website to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446550122658:role/GitHubActionsCloudResumeRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ s3://rahul-cloud-resume-446550122658-ap-south-1/ --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E91FLFSIF0QIS \
            --paths "/*"
