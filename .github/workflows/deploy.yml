name: Deploy Cloud Resume Website

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Website to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          export TOKEN_JSON

          python3 - <<'PY'
          import os
          import json
          import base64

          response = json.loads(os.environ["TOKEN_JSON"])
          token = response["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446550122658:role/GitHubActionsCloudResumeRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ s3://rahul-cloud-resume-446550122658-ap-south-1/ --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E91FLFSIF0QIS \
            --paths "/*"
